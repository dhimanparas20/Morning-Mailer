{% extends "base.html" %}
{% block title %}OAuth Setup - Morning Mailer{% endblock %}
{% block navbar %}{% endblock %}
{% block content %}
<div class="row justify-content-center" style="margin-top:3rem;">
    <div class="col-lg-6">
        <div class="card">
            <div class="card-body text-center py-5">
                <div class="spinner-border mb-3" role="status" style="color:var(--mm-primary);">
                    <span class="visually-hidden">Loading...</span>
                </div>
                <h5 class="fw-semibold">Redirecting to Google OAuth...</h5>
                <p class="text-muted">Keyword: <code>{{ keyword }}</code></p>
                <p class="text-muted">If the browser didn't open, click below:</p>
                <a href="{{ auth_url }}" class="btn btn-primary mt-2" target="_blank">
                    <i class="bi bi-box-arrow-up-right"></i> Open Google OAuth
                </a>
                <div class="mt-3">
                    <a href="/users" class="btn btn-outline-secondary btn-sm">Back to Users</a>
                </div>
            </div>
        </div>
    </div>
</div>
<script>
setTimeout(function() { window.location.href = "{{ auth_url | safe }}"; }, 1500);
</script>
{% endblock %}
