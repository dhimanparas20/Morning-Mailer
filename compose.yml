services:
  waha:
    container_name: waha
    restart: always
    image: devlikeapro/waha

    logging:
      driver: 'json-file'
      options:
        max-size: '100m'
        max-file: '10'

    ports:
      - '3000:3000/tcp'

    networks:
      - app-network

    volumes:
      # Store sessions in the .sessions folder (comment it if you're using MongoDB)
      - './sessions:/app/.sessions'

      # Save media files
      # https://waha.devlike.pro/docs/how-to/storages/#save-media-files-between-the-container-restarts
      - './media:/app/.media'

    env_file:
      - .env

  ollama:
      image: ollama/ollama:latest
      container_name: ollama
      restart: unless-stopped
      ports:
        - '11434:11434'
      networks:
        - app-network
      volumes:
        - ollama_data:/root/.ollama
      environment:
        - OLLAMA_HOST=0.0.0.0
        - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.2:3b}
        # === CPU & memory tuning ===
        - OLLAMA_NUM_THREADS=4          # match your CPU cores
        - OLLAMA_CONTEXT_LENGTH=2048    # shorter context = faster generation
        - OLLAMA_KEEP_ALIVE=5m          # keep model loaded in RAM between requests
        # Optional: disable GPU completely (saves a few ms)
        - OLLAMA_NUM_GPU=0
      healthcheck:
        test: [ "CMD", "ollama", "list" ]
        interval: 30s
        timeout: 10s
        retries: 3
        start_period: 30s
        start_interval: 10s
      # Reserve resources to prevent CPU/memory contention
      deploy:
        resources:
          limits:
            cpus: "4"
            memory: "12G"       # leave 4G for system & other containers
          reservations:
            cpus: "4"
            memory: "8G"        # guaranteed minimum
      # GPU passthrough (uncomment for NVIDIA GPU support):
      # deploy:
      #   resources:
      #     reservations:
      #       devices:
      #         - driver: nvidia
      #           count: 1
      #           capabilities: [gpu]

  valkey:
    image: docker.io/bitnami/valkey:latest
    container_name: valkey
    environment:
      ALLOW_EMPTY_PASSWORD: "yes"
    command:
      - /opt/bitnami/scripts/valkey/run.sh
      # Load the JSON module
      - --loadmodule
      - "/opt/bitnami/valkey/modules/libjson.so"
      # Keep the password as a single argv token
      - --requirepass
      - "testpass"
      - --appendonly
      - "yes"
      - --save
      - "3600"
      - "1"
      - --save
      - "300"
      - "100"
      - --save
      - "60"
      - "10000"
    volumes:
      - valkey_data:/bitnami/valkey/data
    networks:
      - app-network
    healthcheck:
      test: [ "CMD-SHELL", "valkey-cli -a testpass ping | grep -q PONG" ]
      interval: 2m
      timeout: 5s
      retries: 10
      start_period: 10s
      start_interval: 2s
    restart: unless-stopped

  huey:
    build:
      context: .
    image: morning-mailer
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app
    networks:
      - app-network
    extra_hosts:
      - host.docker.internal:host-gateway
    dns:
      - 8.8.8.8
      - 8.8.4.4
      - 1.1.1.1
    volumes:
      - ./modules:/app/modules
      - ./modules/ipython_startup.py:/app/.ipython/profile_default/startup/auto_reload.py
      - ./tasks.py:/app/tasks.py
      - ./cli_users.py:/app/cli_users.py
      - ./gauth:/app/gauth
      - ./google_auth:/app/google_auth
      - ./users.json:/app/users.json
      - ./.env:/app/.env
    command: uv run huey_consumer tasks.huey -k thread -w 1 --flush-locks info
    depends_on:
      valkey:
        condition: service_healthy
    healthcheck:
      test: [
        "CMD-SHELL",
        "python -c \"import os,sys; import redis; r=redis.Redis.from_url(os.getenv('REDIS_URL')); sys.exit(0 if r.ping() else 1)\""
      ]
      interval: 3m
      timeout: 5s
      retries: 3
      start_period: 10s
      start_interval: 2s

  app:
    build:
      context: .
    image: morning-mailer
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app
      - PYTHONFAULTHANDLER=1
      - GAI_CONFIG=prefer-ipv4
    networks:
      - app-network
    dns:
      - 8.8.8.8
      - 8.8.4.4
      - 1.1.1.1
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - '${ADMIN_PORT:-8000}:8000'
    volumes:
      - ./admin:/app/admin
      - ./modules:/app/modules
      - ./modules/ipython_startup.py:/app/.ipython/profile_default/startup/auto_reload.py
      - ./cli_users.py:/app/cli_users.py
      - ./tasks.py:/app/tasks.py
      - ./gauth:/app/gauth
      - ./google_auth:/app/google_auth
      - ./users.json:/app/users.json
      - ./.env:/app/.env
    command: uvicorn admin.main:app --host 0.0.0.0 --port 8000 --reload --proxy-headers --workers 1 --use-colors --log-level debug
    depends_on:
      valkey:
        condition: service_healthy
      huey:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "python -c \"import urllib.request,json; r=urllib.request.urlopen('http://localhost:8000/health',timeout=5); exit(0 if r.status==200 else 1)\"" ]
      interval: 30m
      timeout: 10s
      retries: 3
      start_period: 30s
      start_interval: 5s

